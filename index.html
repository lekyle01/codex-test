<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydration Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>💧 Hydration Tracker</h1>
        <p>Track how much water you drink each day.</p>
      </header>

      <section class="card">
        <label for="dailyGoal">Daily goal (ml)</label>
        <div class="goal-row">
          <input id="dailyGoal" type="number" min="250" step="50" value="2000" />
          <button id="saveGoal">Save Goal</button>
        </div>
      </section>

      <section class="card">
        <h2>Today's Progress</h2>
        <p id="progressText">0 ml / 2000 ml</p>
        <div class="progress-track" aria-label="Daily hydration progress">
          <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="quick-add">
          <button class="add-water" data-amount="250">+250 ml</button>
          <button class="add-water" data-amount="500">+500 ml</button>
          <button class="add-water" data-amount="750">+750 ml</button>
        </div>

        <form id="customAmountForm" class="custom-add">
          <label for="customAmount">Custom amount (ml)</label>
          <input id="customAmount" type="number" min="50" step="50" required />
          <button type="submit">Add Water</button>
        </form>

        <button id="resetToday" class="danger">Reset Today</button>
      </section>

      <section class="card">
        <h2>Last 7 Days</h2>
        <ul id="historyList" class="history"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
